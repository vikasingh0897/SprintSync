# ==============================================================
# Render Infrastructure Blueprint for SprintSync Monorepo
# Deploys both Backend (Express + Socket.io) and Frontend (Next.js)
# ==============================================================

services:
  # ────────────────────────────────────────────────────────────
  # 1. Backend Web Service (Node.js + Express + Socket.IO)
  # ────────────────────────────────────────────────────────────
  - type: web
    name: sprintsync-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://sprintsync-frontend-br5h.onrender.com
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas URI in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      # Brevo Transactional Email Configuration (HTTPS API v3 - recommended for Render free tier)
      - key: BREVO_API_KEY
        sync: false # Set your Brevo API v3 key in Render dashboard (xkeysib-...)
      - key: BREVO_SENDER_EMAIL
        sync: false # Verified sender email in Brevo (e.g. vikas@web3task.com)
      # Optional Brevo SMTP Relay / Generic SMTP Fallback
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false # Optional Brevo SMTP login email
      - key: SMTP_PASS
        sync: false # Optional Brevo SMTP key
      - key: FROM_EMAIL
        sync: false # Fallback verified sender email
      - key: FROM_NAME
        value: "SprintSync Team"

  # ────────────────────────────────────────────────────────────
  # 2. Frontend Web Service (Next.js 16 Production)
  # ────────────────────────────────────────────────────────────
  - type: web
    name: sprintsync-frontend
    runtime: node
    plan: free
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://sprintsync-api-61jv.onrender.com/api
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://sprintsync-api-61jv.onrender.com
