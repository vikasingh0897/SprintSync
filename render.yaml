# ==============================================================
# Render Infrastructure Blueprint for SprintSync Monorepo
# Deploys both Backend (Express + Socket.io) and Frontend (Next.js)
# ==============================================================

services:
  # ────────────────────────────────────────────────────────────
  # 1. Backend Web Service (Node.js + Express + Socket.IO)
  # ────────────────────────────────────────────────────────────
  - type: web
    name: sprintsync-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://sprintsync-frontend-br5h.onrender.com
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas URI in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      # Email / SMTP Configuration
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false # Set your email in Render dashboard (e.g. vikas@web3task.com)
      - key: SMTP_PASS
        sync: false # Set your 16-character App Password in Render dashboard (e.g. juayadwtcfgifxom)
      - key: FROM_EMAIL
        sync: false # Set sender email (e.g. vikas@web3task.com)
      - key: FROM_NAME
        value: "SprintSync Team"

  # ────────────────────────────────────────────────────────────
  # 2. Frontend Web Service (Next.js 16 Production)
  # ────────────────────────────────────────────────────────────
  - type: web
    name: sprintsync-frontend
    runtime: node
    plan: free
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to https://<your-backend-slug>.onrender.com/api in Render Dashboard
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false # Set to https://<your-backend-slug>.onrender.com in Render Dashboard
